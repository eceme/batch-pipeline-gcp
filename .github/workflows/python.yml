# Python lint, format, lockfile and unit test checks.
name: python

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: uv lock --check
        run: uv lock --check

      - name: uv lock --check (dbt)
        run: uv lock --check --directory dbt

      - name: ruff check
        run: uv run ruff check --output-format=github .

      - name: ruff format
        run: uv run ruff format --check --diff .

      - name: pytest
        run: uv run pytest
