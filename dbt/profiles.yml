# No secrets here: dbt authenticates with ADC and impersonates the pipeline service account.
github_pipeline:
  target: dev
  outputs:
    dev:
      type: bigquery
      method: oauth
      project: "{{ env_var('GCP_PROJECT') }}"
      dataset: staging
      location: EU
      impersonate_service_account: "{{ env_var('IMPERSONATE_SA') }}"
      threads: 4
      job_execution_timeout_seconds: 300
      maximum_bytes_billed: 1000000000 # Cost guard: fail any query that would bill more than 1 GB.
